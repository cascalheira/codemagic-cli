name: Release

# Runs when a version tag is pushed (e.g. v1.2.0) or triggered manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

    # Allow the workflow to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ── Build each platform / architecture ────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # let all builds finish even if one fails
      matrix:
        include:
          # ── macOS ───────────────────────────────────────────────────────────
          # Both macOS jobs run on Apple Silicon runners.
          # Rust + Apple's toolchain cross-compile x86-64 natively — no extra setup.
          - name: macOS · x86-64 (cross-compiled)
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact: codemagic-cli-macos-x86_64

          - name: macOS · arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: codemagic-cli-macos-aarch64

          # ── Linux ────────────────────────────────────────────────────────────
          - name: Linux · x86-64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: codemagic-cli-linux-x86_64

          - name: Linux · arm64
            runner: ubuntu-24.04-arm # native ARM64 GitHub-hosted runner
            target: aarch64-unknown-linux-gnu
            artifact: codemagic-cli-linux-aarch64

          # ── Windows ──────────────────────────────────────────────────────────
          # x86-64 on the standard hosted runner; arm64 on the native ARM64
          # runner. Native arm64 avoids cross-compiling `aws-lc-sys` (reqwest's
          # rustls crypto backend), which is painful to cross-build for MSVC arm64.
          - name: Windows · x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codemagic-cli-windows-x86_64

          - name: Windows · arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: codemagic-cli-windows-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches ~/.cargo/registry and the target/ directory between runs,
      # keyed by target triple so each matrix leg has its own cache.
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # reqwest links against the system OpenSSL on Linux (native-tls feature).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      # Build only the CLI package. The GUI app (`codemagic-app`) enables the
      # `desktop` feature by default, which pulls in webkit2gtk on Linux — not
      # installed on these runners. The desktop app is bundled separately in the
      # `bundle` job below.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p codemagic-cli

      # Reduces binary size — safe for distribution builds.
      # Must happen BEFORE signing — stripping after signing invalidates the signature.
      # Skipped on Windows: the MSVC linker produces PE binaries that strip(1)
      # cannot safely process; debug info is simply not embedded in release builds.
      - name: Strip debug symbols
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/codemagic-cli

      # ── macOS code signing ────────────────────────────────────────────────
      # Import the Developer ID Application certificate into a short-lived
      # keychain so codesign can find it without touching the login keychain.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          # Decode the base64 certificate to a temp .p12 file
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12

          # Create a dedicated build keychain and make it the default
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Keep the keychain unlocked for up to 1 hour (enough for the job)
          security set-keychain-settings -t 3600 -u build.keychain

          # Import the certificate and allow codesign to access it
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Clean up the decoded .p12 immediately
          rm /tmp/certificate.p12

      # Sign with the Hardened Runtime flag — required for notarization.
      - name: Sign binary
        if: runner.os == 'macOS'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign \
            --force \
            --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            target/${{ matrix.target }}/release/codemagic-cli

          # Verify the signature looks correct before continuing
          codesign --verify --deep --strict --verbose=2 \
            target/${{ matrix.target }}/release/codemagic-cli

      # Notarize the signed binary with Apple.
      # notarytool requires a zip/dmg/pkg — wrap the binary, submit, then discard the zip.
      - name: Notarize binary
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Wrap into a zip for submission (notarytool does not accept bare binaries)
          ditto -c -k --keepParent \
            target/${{ matrix.target }}/release/codemagic-cli \
            /tmp/codemagic-cli-notarize.zip

          # Submit and wait for Apple to finish (usually < 2 min)
          xcrun notarytool submit /tmp/codemagic-cli-notarize.zip \
            --apple-id      "$APPLE_ID" \
            --password      "$APPLE_APP_PASSWORD" \
            --team-id       "$APPLE_TEAM_ID" \
            --wait

          rm /tmp/codemagic-cli-notarize.zip

      # Always remove the temporary keychain, even if a previous step failed.
      - name: Clean up keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain build.keychain || true

      # Pack the binary and generate a SHA-256 checksum.
      # • Windows  → codemagic-cli.exe  packaged as .zip
      # • macOS    → codemagic-cli      packaged as .tar.gz  (shasum)
      # • Linux    → codemagic-cli      packaged as .tar.gz  (sha256sum)
      - name: Package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/codemagic-cli.exe" codemagic-cli.exe
            powershell -Command "
              Compress-Archive \
                -Path 'codemagic-cli.exe' \
                -DestinationPath '${{ matrix.artifact }}.zip'"
            sha256sum "${{ matrix.artifact }}.zip" \
              > "${{ matrix.artifact }}.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/codemagic-cli codemagic-cli
            tar -czf "${{ matrix.artifact }}.tar.gz" codemagic-cli

            # sha256sum command differs between macOS and GNU/Linux
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              shasum -a 256 "${{ matrix.artifact }}.tar.gz" \
                > "${{ matrix.artifact }}.tar.gz.sha256"
            else
              sha256sum "${{ matrix.artifact }}.tar.gz" \
                > "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          fi

      - name: Upload build artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          # Glob captures both .tar.gz/.tar.gz.sha256 (Unix) and .zip/.zip.sha256 (Windows)
          path: "${{ matrix.artifact }}.*"
          if-no-files-found: error

  # ── Bundle the desktop GUI app (macOS .app / Windows installer) ────────────
  # `dx bundle` reads app/Dioxus.toml and bakes the icon into each bundle
  # automatically (icon.icns for macOS, icon.ico for Windows). The macOS .app is
  # code-signed (Developer ID + Hardened Runtime), notarized, and stapled so it
  # launches without a Gatekeeper prompt. The Windows installer is unsigned —
  # SmartScreen will warn until a code-signing certificate is added.
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: App · macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            package_types: macos
            artifact: codemagic-app-macos-aarch64

          - name: App · macOS x86-64 (cross-compiled)
            runner: macos-latest
            target: x86_64-apple-darwin
            package_types: macos
            artifact: codemagic-app-macos-x86_64

          - name: App · Windows x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            package_types: nsis
            artifact: codemagic-app-windows-x86_64

          # Native ARM64 runner: builds + bundles aarch64 without cross-compiling
          # aws-lc-sys (see the CLI job's Windows note).
          - name: App · Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package_types: nsis
            artifact: codemagic-app-windows-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.target }}

      # Install dioxus-cli from source, pinned + locked to match Cargo.lock.
      # (Prebuilt via binstall is faster, but its no-prebuilt path either drops
      # --locked — mis-resolving git2 and failing to compile auth-git2 — or
      # exits 0 without installing. --locked from source is deterministic.)
      # Then put the cargo bin dir on PATH for the bundle step (native path on
      # Windows) and verify `dx` is actually runnable so any failure surfaces here.
      - name: Install dioxus-cli
        shell: bash
        run: |
          set -eo pipefail
          cargo install dioxus-cli@0.7.9 --locked
          BIN="$HOME/.cargo/bin"
          if command -v cygpath >/dev/null 2>&1; then BIN="$(cygpath -w "$BIN")"; fi
          echo "$BIN" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/dx" --version

      - name: Bundle desktop app
        working-directory: app
        run: dx bundle --platform desktop --release --target ${{ matrix.target }} --package-types ${{ matrix.package_types }} --out-dir dist

      # ── macOS code signing + notarization ─────────────────────────────────
      # Import the Developer ID Application certificate into a short-lived
      # keychain so codesign can find it (same flow as the CLI build job).
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12

      # Sign the nested executable first, then the .app bundle itself, with the
      # Hardened Runtime flag required for notarization.
      - name: Sign app bundle
        if: runner.os == 'macOS'
        working-directory: app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="$(ls -d dist/*.app | head -1)"
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$APP/Contents/MacOS/codemagic-app"
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Submit to Apple, wait for the result, then staple the ticket to the .app
      # so it validates offline.
      - name: Notarize and staple
        if: runner.os == 'macOS'
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$(ls -d dist/*.app | head -1)"
          ditto -c -k --keepParent "$APP" /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id  "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          rm /tmp/notarize.zip

      - name: Clean up keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain build.keychain || true

      # Zip the (signed + stapled) .app on macOS, or grab the NSIS setup .exe on
      # Windows, then checksum.
      - name: Package
        shell: bash
        working-directory: app
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APP="$(ls -d dist/*.app | head -1)"
            ditto -c -k --keepParent "$APP" "${{ matrix.artifact }}.zip"
            shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            SETUP="$(ls dist/*.exe | head -1)"
            cp "$SETUP" "${{ matrix.artifact }}.exe"
            sha256sum "${{ matrix.artifact }}.exe" > "${{ matrix.artifact }}.exe.sha256"
          fi

      - name: Upload bundle artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: "app/${{ matrix.artifact }}.*"
          if-no-files-found: error

  # ── Publish a GitHub Release (tag pushes only) ────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build, bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true # flatten into dist/ rather than per-artifact dirs

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generate release notes from merged PRs / commit messages.
          generate_release_notes: true
          files: dist/*
