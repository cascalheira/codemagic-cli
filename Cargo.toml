[workspace]
resolver = "3"
members = ["core", "cli", "app"]

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cascalheira/codemagic-cli"
# Both feed the Linux package metadata: `authors` becomes the .deb's
# Maintainer field (otherwise "Unknown"), `homepage` its Homepage.
authors = ["Antonio Cascalheira"]
homepage = "https://github.com/cascalheira/codemagic-cli"

[workspace.dependencies]
gantry-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
tokio = { version = "1", features = ["full"] }

# Small, slow-to-download release binaries for the GUI app.
[profile.release]
opt-level = "z"
lto = true
strip = true
