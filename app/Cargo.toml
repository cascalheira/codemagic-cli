[package]
name = "codemagic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform (desktop + mobile) Codemagic.io client built with Dioxus."

[dependencies]
codemagic-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
rfd = "0.15"
tokio = { version = "1", features = ["time"] }
dioxus = { version = "0.7", features = ["router"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

# Native notifications on desktop only; iOS/Android have no equivalent here.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
notify-rust = "4"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
