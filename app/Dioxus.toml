[application]
name = "gantry"

[web.app]
title = "Gantry"

[bundle]
identifier = "io.github.cascalheira.gantry"
publisher = "Gantry"
icon = ["assets/icon.icns", "assets/icon.ico", "assets/icon-1024.png"]

# dioxus-cli defaults this to `OfflineInstaller`, which embeds Microsoft's
# entire WebView2 runtime installer and takes the setup .exe from ~4 MB to
# ~175 MB. WebView2 ships with Windows 11 and arrives on Windows 10 with Edge,
# so the runtime is almost always already there; on the rare machine without
# it, the bootstrapper fetches it at install time.
[bundle.windows.webview_install_mode.DownloadBootstrapper]
silent = true

# Without these the .deb declares no dependencies at all: it installs cleanly
# on a machine with no web engine and then dies on a missing .so. The list is
# the binary's DT_NEEDED entries reduced to the packages that own them —
# cairo, glib, gdk-pixbuf and wayland all arrive transitively via libgtk-3-0,
# and libjavascriptcoregtk ships inside libwebkit2gtk-4.1-0. OpenSSL is an
# alternative because 24.04 renamed the package during the time_t transition.
[bundle.deb]
depends = [
  "libwebkit2gtk-4.1-0",
  "libgtk-3-0",
  "libxdo3",
  "libssl3 | libssl3t64",
]
