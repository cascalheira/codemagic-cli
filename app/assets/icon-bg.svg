<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle background: teal -> green, top-down -->
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD8AC"/>
      <stop offset="0.55" stop-color="#12B983"/>
      <stop offset="1" stop-color="#059268"/>
    </linearGradient>
    <!-- Soft top gloss -->
    <linearGradient id="gloss" x1="512" y1="120" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Flame -->
    <linearGradient id="flame" x1="512" y1="636" x2="512" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FF8A34"/>
    </linearGradient>
    <radialGradient id="port" cx="512" cy="462" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FE9FF"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#003b2b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded-rect "squircle" (824x824, 100px margin, ~22.5% radius) -->
  <rect x="0" y="0" width="1024" height="1024" rx="0" ry="0" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="0" ry="0" fill="url(#gloss)"/>

  <!-- Sparkles ("magic") -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M690 300 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" opacity="0.7"/>
    <path d="M336 372 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" opacity="0.55"/>
    <circle cx="700" cy="470" r="7" opacity="0.5"/>
    <circle cx="360" cy="286" r="6" opacity="0.45"/>
  </g>
</svg>
